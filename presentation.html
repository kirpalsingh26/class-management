<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduManage — Class Management System Presentation</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --card-bg: #ffffff;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .slide-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 960px;
      min-height: 580px;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      padding: 3rem 3.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .slide-header {
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 9999px;
      background: #dbeafe;
      color: #1e40af;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
    }
    h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1e293b;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #334155;
    }
    .slide-footer {
      border-top: 1px solid #f1f5f9;
      padding-top: 1rem;
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1rem; }
    .card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }
    .card h3 { font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem; }
    .card p, .card li { font-size: 0.92rem; color: #475569; }
    ul { padding-left: 1.25rem; }
    li { margin-bottom: 0.5rem; }
    .highlight { color: var(--primary); font-weight: 600; }
    .pill { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; margin-right: 0.25rem; }
    pre {
      background: #0f172a;
      color: #38bdf8;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: monospace;
      overflow-x: auto;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>

<div class="slide-container">
  <div id="slideContent"></div>

  <div class="slide-footer">
    <div id="slideCounter">Slide 1 of 10</div>
    <div>Use <strong>Left / Right Arrow Keys</strong> or Buttons to Navigate</div>
    <div class="controls">
      <button id="prevBtn" onclick="prevSlide()">← Previous</button>
      <button id="nextBtn" onclick="nextSlide()">Next →</button>
    </div>
  </div>
</div>

<script>

  },
  {

    content: `

        <div class="card">

    `
  },
  {
    badge: "Teacher Portal",
    title: "Teacher Capabilities",
    subtitle: "Classroom Governance & Student Roster",
    content: `
      <ul>
        <li><strong>Class Management:</strong> Create, edit, and delete classes; manage student roster.</li>
        <li><strong>Student Directory:</strong> Search students by name or roll number; add new student accounts.</li>
        <li><strong>Attendance Marking:</strong> Select date, single-click "Mark All Present", or mark Absent with automatic deduplication.</li>

  {
    badge: "Student Portal",

    subtitle: "Designed for Clear, Simple Coursework & Attendance Access",
    content: `

        <h3>Configured Student Profile</h3>

  },
  {

    subtitle: "Mongoose ODM Schemas",
    content: `
      <div class="grid">

    content: `

          <p>Using <code>Attendance.findOneAndUpdate()</code> with <code>upsert: true</code>:</p>
          <p>Saving attendance again for the same class and date safely overwrites the status without creating duplicate rows.</p>

  {

          <li>Class creation & student enrollment verification</li>
          <li>Attendance recording, deduplication, & student percentage retrieval</li>

          <li>Class data isolation & role-based HTTP 403 blocking</li>
        </ul>
      </div>
    `
  },
  {
    badge: "Viva Demo",
    title: "Live Demonstration & Accounts",
    subtitle: "Credentials Configured for Viva Evaluation",
    content: `
      <div class="grid">
        <div class="card">
          <h3>Teacher Account</h3>
          <p><strong>Email:</strong> <code>teacher@cms.dev</code></p>
          <p><strong>Password:</strong> <code>password123</code></p>
          <p><strong>Name:</strong> Prof. Rajesh Sharma</p>
        </div>
        <div class="card">
          <h3>Student Account (Primary)</h3>
          <p><strong>Email:</strong> <code>kirpal@cms.dev</code></p>
          <p><strong>Password:</strong> <code>password123</code></p>
          <p><strong>Name:</strong> Kirpal Singh (Roll: 2421217, IT)</p>
        </div>
      </div>
      <p style="text-align: center; margin-top: 1.5rem; font-weight: 700; color: #2563eb;">
        * Single-click buttons available directly on the login screen for instant demo!
      </p>
    `
  }
];

let currentIndex = 0;

function renderSlide() {
  const slide = slides[currentIndex];
  document.getElementById('slideContent').innerHTML = \`
    <div class="slide-header">
      <div>
        <span class="badge">\${slide.badge}</span>
        <h1 style="margin-top: 0.5rem;">\${slide.title}</h1>
        <p class="subtitle">\${slide.subtitle}</p>
      </div>
    </div>
    <div class="slide-body">
      \${slide.content}
    </div>
  \`;

  document.getElementById('slideCounter').innerText = \`Slide \${currentIndex + 1} of \${slides.length}\`;
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === slides.length - 1;
}

function prevSlide() {
  if (currentIndex > 0) {
    currentIndex--;
    renderSlide();
  }
}

function nextSlide() {
  if (currentIndex < slides.length - 1) {
    currentIndex++;
    renderSlide();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  else if (e.key === 'ArrowLeft') prevSlide();
});

renderSlide();
</script>

</body>
</html>
